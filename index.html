    function allMeals() {
      return [...MEAL_DATA.Breakfast, ...MEAL_DATA.Lunch, ...MEAL_DATA.Dinner, ...MEAL_DATA.Desserts, ...MEAL_DATA.Nammi];
    }

    function getStableShuffledDeck(category) {
      const today = new Date().toISOString().split('T')[0];
      const seed = today.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
      const meals = [...MEAL_DATA[category]];
      let rng = seed;
      for (let i = meals.length - 1; i > 0; i--) {
        rng = (rng * 9301 + 49297) % 233280;
        const j = Math.floor((rng / 233280) * (i + 1));
        [meals[i], meals[j]] = [meals[j], meals[i]];
      }
      return meals;
    }

    function generateCode() {
      const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      return Array.from({ length: 5 }, () => letters[Math.floor(Math.random() * letters.length)]).join('');
    }


    // === FIREBASE ===

    const FIREBASE_CONFIG = {

      authDomain: "table-for-two-2b51e.firebaseapp.com",
      projectId: "table-for-two-2b51e",
      storageBucket: "table-for-two-2b51e.firebasestorage.app",

    let db = null;
    let auth = null;
    let firebaseReady = false;

    async function initFirebase() {
      if (!window.firebase) throw new Error('Firebase SDK did not load.');
      if (FIREBASE_CONFIG.apiKey.startsWith('YOUR_')) {
        throw new Error('Firebase is not configured yet. Add your Firebase Web App config to index.html.');
      }
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      auth = firebase.auth();

      if (!auth.currentUser) {
        await auth.signInAnonymously();
      }
      currentUid = auth.currentUser && auth.currentUser.uid;
      if (!currentUid) throw new Error('Could not create an anonymous Firebase session.');
      firebaseReady = true;
    }

    function normalizeTicket(data) {
      return {
        code: data.code,
        category: data.category,
        hostSwipes: data.hostSwipes || {},
        guestSwipes: data.guestSwipes || {},
        joined: !!data.joined,
        hostUid: data.hostUid || null,
        guestUid: data.guestUid || null
      };
    }

    // === COMPONENTS ===

    function WaitingScreen({ code, onLeave }) {
      const [copied, setCopied] = useState(false);
      const share = async () => {
        const text = `Join my food order! Ticket code: ${code}`;
        try {
          if (navigator.share) await navigator.share({ text });
          else {
            await navigator.clipboard.writeText(text);
            setCopied(true);
            setTimeout(() => setCopied(false), 1500);
          }

      };
      return (

    function SwipeScreen({ mode, category, deck, setDeck, ownSwipes, setOwnSwipes, matches, onLeave }) {
      const [dragPos, setDragPos] = useState({ x: 0, y: 0 });
      const [showMatches, setShowMatches] = useState(false);
      const [celebration, setCelebration] = useState(null);
      const draggingRef = useRef(false);
      const startRef = useRef({ x: 0, y: 0 });
      const celebratedRef = useRef(new Set());

      useEffect(() => {
        if (mode !== 'multiplayer') return;
        const fresh = matches.find((m) => !celebratedRef.current.has(m.id));
        if (fresh) {
          celebratedRef.current.add(fresh.id);
          setCelebration(fresh);
        }
      }, [matches, mode]);

      const swipeCurrent = (liked) => {
        const meal = deck[0];
        if (!meal) return;
        const updated = { ...ownSwipes, [meal.id]: liked };
        setOwnSwipes(updated);
        draggingRef.current = false;
        setDragPos({ x: liked ? 650 : -650, y: 0 });
        setTimeout(() => {
          setDeck((d) => d.slice(1));
          setDragPos({ x: 0, y: 0 });
        }, 220);
      };

      const onPointerDown = (e) => {
        draggingRef.current = true;
        startRef.current = { x: e.clientX, y: e.clientY };
      };
      const onPointerMove = (e) => {
        if (!draggingRef.current) return;
        setDragPos({ x: e.clientX - startRef.current.x, y: e.clientY - startRef.current.y });
      };
      const onPointerUp = () => {
        if (!draggingRef.current) return;
        draggingRef.current = false;
        if (dragPos.x > 110) swipeCurrent(true);
        else if (dragPos.x < -110) swipeCurrent(false);
        else setDragPos({ x: 0, y: 0 });
      };

      const meta = CATEGORY_META[category];
      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '1.25rem 1.25rem', color: 'var(--ink)' }}>
            <button style={{ fontSize: '0.875rem', color: 'var(--ink-soft)', background: 'none', border: 'none', cursor: 'pointer' }} onClick={onLeave}>Leave</button>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: '0.375rem', color: 'white', borderRadius: '999px', fontSize: '0.78rem', fontWeight: '600', padding: '0.25rem 0.75rem', background: `var(${meta.varName})` }}><span>{meta.emoji}</span><span>{category}</span></div>
            <button style={{ fontSize: '0.875rem', fontWeight: '600', padding: '0.375rem 0.75rem', borderRadius: '9999px', background: 'var(--ink)', color: 'var(--paper)', border: 'none', cursor: 'pointer' }} onClick={() => setShowMatches(true)}>{mode === 'solo' ? 'Picks' : 'Orders'} {matches.length > 0 ? `· ${matches.length}` : ''}</button>
          </div>

          {deck.length === 0 ? (
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: '2rem' }}>
              <p style={{ fontSize: '2rem', marginBottom: '1rem' }}>🎉</p>
              <p style={{ fontFamily: 'Fraunces', fontSize: '1.25rem', fontWeight: '600', marginBottom: '0.5rem' }}>You've cleared the menu!</p>
              <p style={{ fontSize: '0.875rem', color: 'var(--ink-soft)' }}>{mode === 'solo' ? 'Check your picks, or leave to start over.' : 'Check your orders, or leave to start a new ticket.'}</p>
            </div>
          ) : (
            <>
              <div style={{ position: 'relative', flex: 1, marginLeft: '1.5rem', marginRight: '1.5rem', marginBottom: '1rem', minHeight: 380 }}>
                {deck.slice(0, 3).map((meal, idx) => (
                  <div key={meal.id} style={{ position: 'absolute', inset: 0, background: 'var(--card)', borderRadius: '1.125rem', border: '1px solid rgba(43,36,29,0.10)', boxShadow: '6px 6px 0 rgba(43,36,29,0.16)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '1.5rem', zIndex: 10 - idx, transform: `translate(${idx === 0 ? dragPos.x : 0}px, ${idx === 0 ? dragPos.y : idx * 8}px) rotate(${idx === 0 ? dragPos.x / 18 : 0}deg) scale(${1 - idx * 0.04})`, transition: idx === 0 && draggingRef.current ? 'none' : 'transform 0.25s ease', touchAction: 'none', cursor: idx === 0 ? 'grab' : 'default', userSelect: 'none' }} onPointerDown={idx === 0 ? onPointerDown : undefined} onPointerMove={idx === 0 ? onPointerMove : undefined} onPointerUp={idx === 0 ? onPointerUp : undefined} onPointerCancel={idx === 0 ? onPointerUp : undefined}>
                    <p style={{ fontSize: '4rem', lineHeight: 1, marginBottom: '1rem' }}>{meal.emoji}</p>
                    <h2 style={{ fontFamily: 'Fraunces', fontSize: '1.5rem', fontWeight: '600', textAlign: 'center', marginBottom: '0.5rem' }}>{meal.name}</h2>
                    <p style={{ fontSize: '0.875rem', color: 'var(--ink-soft)', textAlign: 'center', maxWidth: '30ch' }}>{meal.description}</p>
                  </div>
                ))}
              </div>

              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '2.5rem', paddingBottom: '2rem' }}>
                <button style={{ width: '3.75rem', height: '3.75rem', borderRadius: '999px', border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', background: 'var(--ink)' }} onClick={() => swipeCurrent(false)}><X color="#FBF3E4" size={26} /></button>
                <button style={{ width: '3.75rem', height: '3.75rem', borderRadius: '999px', border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', background: 'var(--tomato)' }} onClick={() => swipeCurrent(true)}><Heart color="#FFFDF9" size={26} fill="#FFFDF9" /></button>
              </div>
            </>
          )}

          {showMatches && (
            <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'flex-end', justifyContent: 'center', background: 'rgba(43,36,29,0.45)' }} onClick={() => setShowMatches(false)}>
              <div style={{ background: 'var(--paper)', borderTopLeftRadius: '1.5rem', borderTopRightRadius: '1.5rem', padding: '1.5rem 1.5rem 2rem', maxHeight: '75vh', overflowY: 'auto', width: '100%', maxWidth: '28rem', animation: 'fadeIn 0.3s ease' }} onClick={(e) => e.stopPropagation()}>
                <div style={{ width: '2.5rem', height: '0.375rem', borderRadius: '9999px', background: 'rgba(43,36,29,0.2)', margin: '0 auto 1.25rem' }} />
                <h2 style={{ fontFamily: 'Fraunces', fontSize: '1.5rem', fontWeight: '600', marginBottom: '1.25rem' }}>{mode === 'solo' ? 'Your Picks' : 'Your Orders'}</h2>
                {matches.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '2rem 0' }}>
                    <p style={{ fontSize: '2rem', marginBottom: '0.75rem' }}>🤷</p>
                    <p style={{ fontWeight: '500', marginBottom: '0.25rem' }}>{mode === 'solo' ? 'No picks yet' : 'No orders yet'}</p>
                    <p style={{ fontSize: '0.875rem', color: 'var(--ink-soft)' }}>{mode === 'solo' ? 'Keep swiping — anything you order it on shows up here.' : 'Keep swiping — matches show up here the moment you both order the same thing.'}</p>
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', marginBottom: '1.5rem' }}>
                    {matches.map((meal) => (
                      <div key={meal.id} style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', background: 'var(--card)', border: '1px solid rgba(43,36,29,0.1)', borderRadius: '1.125rem', padding: '0.75rem 1rem' }}>
                        <span style={{ fontSize: '2rem' }}>{meal.emoji}</span>
                        <div><p style={{ fontWeight: '600' }}>{meal.name}</p><p style={{ fontSize: '0.75rem', color: 'var(--ink-soft)' }}>{meal.description}</p></div>
                      </div>
                    ))}
                  </div>
                )}
                <button className="tft-btn tft-btn-ink" style={{ padding: '0.75rem', fontSize: '1rem', width: '100%' }} onClick={() => setShowMatches(false)}>Done</button>
              </div>
              <style>{`@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }`}</style>
            </div>
          )}

          {celebration && (
            <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(43,36,29,0.75)', padding: '2rem' }}>
              <div style={{ textAlign: 'center', animation: 'fadeIn 0.3s ease' }}>
                <p style={{ fontFamily: 'Fraunces', fontSize: '1.75rem', fontWeight: '600', marginBottom: '1.5rem', color: '#FFFDF9' }}>Order confirmed!</p>
                <p style={{ fontSize: '4.5rem', marginBottom: '1rem' }}>{celebration.emoji}</p>
                <p style={{ fontFamily: 'Fraunces', fontSize: '1.5rem', fontWeight: '600', marginBottom: '2rem', color: '#FFFDF9' }}>{celebration.name}</p>
                <button className="tft-btn tft-btn-primary" style={{ padding: '0.75rem 2rem', fontSize: '1rem' }} onClick={() => setCelebration(null)}>Keep Swiping</button>
              </div>
              <style>{`@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }`}</style>
            </div>
          )}
        </div>
      );
    }

    function TableForTwo() {
      const [screen, setScreen] = useState('welcome');
      const [mode, setMode] = useState('multiplayer');
      const [category, setCategory] = useState('Dinner');
      const [deck, setDeck] = useState([]);
      const [ownSwipes, setOwnSwipes] = useState({});
      const [partnerSwipes, setPartnerSwipes] = useState({});
      const [ticketCode, setTicketCode] = useState('');
      const [ticketRole, setTicketRole] = useState(null);
      const [ticketError, setTicketError] = useState('');
      const [firebaseError, setFirebaseError] = useState('');
      const unsubscribeRef = useRef(null);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            await initFirebase();
            if (cancelled) return;
          } catch (e) {
            if (!cancelled) setFirebaseError(e.message);
          }
        })();

        return () => {
          cancelled = true;
          if (unsubscribeRef.current) unsubscribeRef.current();
        };
      }, []);

      const matches = mode === 'solo'
        ? allMeals().filter((m) => ownSwipes[m.id] === true)
        : allMeals().filter((m) => ownSwipes[m.id] === true && partnerSwipes[m.id] === true);

      const startRealtime = (code, role) => {
        if (!db) return;
        if (unsubscribeRef.current) unsubscribeRef.current();
        unsubscribeRef.current = db.collection('tickets').doc(code).onSnapshot((snap) => {
          if (!snap.exists) {
            setTicketError('This ticket no longer exists.');
            return;
          }
          const t = normalizeTicket(snap.data());
          setCategory(t.category);
          if (role === 'host') {
            setOwnSwipes(t.hostSwipes);
            setPartnerSwipes(t.guestSwipes);
            if (t.joined && screen === 'waiting') {
              const stableDeck = getStableShuffledDeck(t.category);
              setDeck(stableDeck.map((m) => ({ ...m, category: t.category })));
              setScreen('swipe');
            }
          } else {
            setOwnSwipes(t.guestSwipes);
            setPartnerSwipes(t.hostSwipes);
          }
        }, (err) => setTicketError(err.message));
      };

      const handleStartSolo = (selectedCategory) => {
        setMode('solo');
        setCategory(selectedCategory);
        const stableDeck = getStableShuffledDeck(selectedCategory);
        setDeck(stableDeck.map((m) => ({ ...m, category: selectedCategory })));
        setOwnSwipes({});
        setPartnerSwipes({});
        setScreen('swipe');
      };

      const handleCreateTicket = async (selectedCategory) => {
        setTicketError('');
        if (!db || !currentUid) {
          setTicketError('Firebase is still connecting. Please wait a moment and try again.');
          return;
        }
        try {
          let code = generateCode();
          for (let i = 0; i < 10; i++) {
            const ref = db.collection('tickets').doc(code);
            const snap = await ref.get();
            if (!snap.exists) break;
            code = generateCode();
          }
          await db.collection('tickets').doc(code).set({
            code,
            category: selectedCategory,
            hostSwipes: {},
            guestSwipes: {},
            joined: false,
            hostUid: currentUid,
            guestUid: null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setMode('multiplayer');
          setCategory(selectedCategory);
          setTicketCode(code);
          setTicketRole('host');
          setScreen('waiting');
          startRealtime(code, 'host');
        } catch (e) {
          setTicketError(e.message || 'Could not create the ticket.');
        }
      };

      const handleJoinTicket = async (rawCode) => {
        setTicketError('');
        if (!db || !currentUid) {
          setTicketError('Firebase is still connecting. Please wait a moment and try again.');
          return;
        }
        const code = rawCode.trim().toUpperCase();
        if (code.length !== 5) {
          setTicketError('Enter the 5-character ticket code.');
          return;
        }
        try {
          const ref = db.collection('tickets').doc(code);
          let t;

          await db.runTransaction(async (tx) => {
            const snap = await tx.get(ref);
            if (!snap.exists) throw new Error('Ticket not found. Check the code and try again.');
            const current = normalizeTicket(snap.data());
            if (current.joined || current.guestUid) {
              throw new Error('That ticket already has two people.');
            }
            tx.update(ref, { joined: true, guestUid: currentUid });
            t = current;
          });

          setMode('multiplayer');
          setCategory(t.category);
          setTicketCode(code);
          setTicketRole('guest');
          const stableDeck = getStableShuffledDeck(t.category);
          setDeck(stableDeck.map((m) => ({ ...m, category: t.category })));
          setOwnSwipes(t.guestSwipes);
          setPartnerSwipes(t.hostSwipes);
          setScreen('swipe');
          startRealtime(code, 'guest');
        } catch (e) {
          setTicketError(e.message || 'Could not join the ticket.');
        }
      };

      const saveSwipe = async (mealId, liked) => {
        if (!db || !ticketCode || !ticketRole) return;
        const field = ticketRole === 'host' ? 'hostSwipes' : 'guestSwipes';
        try {
          await db.collection('tickets').doc(ticketCode).set({
            [field]: { ...ownSwipes, [mealId]: liked }
          }, { merge: true });
        } catch (e) {
          setTicketError(e.message || 'Could not save your choice.');
        }
      };

      const handleLeave = async () => {
        if (unsubscribeRef.current) {
          unsubscribeRef.current();
          unsubscribeRef.current = null;
        }
        if (db && ticketCode && ticketRole === 'host') {
          try {
            await db.collection('tickets').doc(ticketCode).delete();
          } catch (e) {}
        } else if (db && ticketCode && ticketRole === 'guest' && currentUid) {
          try {
            await db.collection('tickets').doc(ticketCode).update({
              joined: false,
              guestUid: null,
              guestSwipes: {}
            });
          } catch (e) {}
        }
        setScreen('welcome');
        setMode('multiplayer');
        setDeck([]);
        setOwnSwipes({});
        setPartnerSwipes({});
        setTicketCode('');
        setTicketRole(null);
        setTicketError('');
      };

      const firebaseBanner = firebaseError && (
        <div style={{
          margin: '0.75rem 1rem', padding: '0.75rem 1rem', borderRadius: '0.75rem',
          background: '#fff1ed', border: '1px solid rgba(193,68,45,0.25)',
          color: 'var(--tomato)', fontSize: '0.8rem', lineHeight: 1.4
        }}>
          {firebaseError}
        </div>
      );

      return (
        <div className="tft-root">
          <GlobalStyles />
          <div style={{ width: '100%', maxWidth: '28rem', margin: '0 auto', display: 'flex', flexDirection: 'column', flex: 1 }}>
            {firebaseBanner}

            {screen === 'welcome' &&
              <WelcomeScreen
                onStart={() => { setMode('multiplayer'); setScreen('create'); setTicketError(''); }}
                onJoin={() => { setScreen('join'); setTicketError(''); }}
                onSolo={() => { setMode('solo'); setScreen('create'); setTicketError(''); }}
              />
            }

            {screen === 'create' &&
              <>
                <CreateScreen
                  onBack={() => setScreen('welcome')}
                  onConfirm={mode === 'solo' ? handleStartSolo : handleCreateTicket}
                  confirmLabel={mode === 'solo' ? 'Start Swiping' : 'Create Ticket'}
                />
                {ticketError && <p style={{ padding: '0 1.5rem', color: 'var(--tomato)', textAlign: 'center', fontSize: '0.85rem' }}>{ticketError}</p>}
              </>
            }

            {screen === 'waiting' &&
              <WaitingScreen code={ticketCode} onLeave={handleLeave} />
            }

            {screen === 'join' &&
              <JoinScreen onBack={() => setScreen('welcome')} onJoin={handleJoinTicket} error={ticketError} />
            }

            {screen === 'swipe' &&
              <SwipeScreen
                mode={mode}
                category={category}
                deck={deck}
                setDeck={setDeck}
                ownSwipes={ownSwipes}
                setOwnSwipes={(next) => {
                  setOwnSwipes(next);
                  const previousIds = Object.keys(ownSwipes);
                  const nextIds = Object.keys(next);
                  const changedId = nextIds.find((id) => !previousIds.includes(id) || ownSwipes[id] !== next[id]);
                  if (changedId) saveSwipe(changedId, next[changedId]);
                }}
                matches={matches}
                onLeave={handleLeave}
              />
            }
          </div>
        </div>
      );
    }

    ReactDOM.render(<TableForTwo />, document.getElementById('root'));
  </script>
</body>
</html>
