// ==================== ERROR BOUNDARY ====================
// If anything crashes, show the actual error instead of a blank page.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error('App crashed:', error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, fontFamily: 'monospace', background: '#FBF3E4', color: '#2B241D', minHeight: '100vh' }}>
          <h2 style={{ marginBottom: 12 }}>Something broke 😬</h2>
          <p style={{ marginBottom: 12, fontSize: 14 }}>Send this to Claude so it can fix it:</p>
          <pre style={{ whiteSpace: 'pre-wrap', fontSize: 12, background: '#FFFDF9', padding: 12, borderRadius: 8, border: '1px solid rgba(0,0,0,0.1)' }}>
            {String((this.state.error && this.state.error.stack) || this.state.error)}
          </pre>
        </div>
      );
    }
    return this.props.children;
  }
}

function allMeals() {

function getStableShuffledDeck(category) {
  const today = new Date().toISOString().split('T')[0];
  const seed = today.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
  const meals = [...MEAL_DATA[category]];
  let rng = seed;
  for (let i = meals.length - 1; i > 0; i--) {
    rng = (rng * 9301 + 49297) % 233280;
    const j = Math.floor((rng / 233280) * (i + 1));
    [meals[i], meals[j]] = [meals[j], meals[i]];
  }
  return meals;
}

function generateCode() {
  const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 5; i++) code += letters[Math.floor(Math.random() * letters.length)];
  return code;
}

function WaitingScreen({ code, onLeave }) {
  const [copied, setCopied] = useState(false);
  const share = async () => {
    const text = `Join my food order! Ticket code: ${code}`;
    try {
      if (navigator.share) { await navigator.share({ text }); return; }
    } catch (e) {}
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {}
  };
  return (
    <div className="flex flex-col items-center justify-center flex-1 px-8 py-10 text-center">
      <p className="text-sm mb-2" style={{ color: 'var(--ink-soft)' }}>Your ticket</p>

  const size = 280;
  const colors = ['var(--tomato)', 'var(--mustard)', 'var(--plum)', '#4A4238'];
  const n = Math.max(matches.length, 1);
  const idxs = Array.from({ length: n }, (_, i) => i % colors.length);
  if (n > colors.length && idxs[n - 1] === idxs[0]) idxs[n - 1] = (idxs[n - 1] + 1) % colors.length;
  const segAngle = 360 / n;
  const gradientStops = idxs.map((ci, i) => `${colors[ci]} ${i * segAngle}deg ${(i + 1) * segAngle}deg`).join(', ');

  // Plays the spin animation for whatever (spinToken, winnerId) we've been
  // handed — same code path whether we started the spin ourselves or our
  // partner did, so both screens always animate toward the same result.
  useEffect(() => {
    if (!spinToken || spinToken === lastPlayedToken.current) return;
    lastPlayedToken.current = spinToken;
    const winIndex = Math.max(0, matches.findIndex((m) => m.id === winnerId));
    setWinner(null);
    setSpinning(true);
    const sliceCenter = winIndex * segAngle + segAngle / 2;
    const jitter = (Math.random() - 0.5) * segAngle * 0.5;
    const extraSpins = 5 + Math.floor(Math.random() * 3);
    const targetMod = ((360 - sliceCenter - jitter) % 360 + 360) % 360;
    setRotation((prev) => {
      const prevMod = ((prev % 360) + 360) % 360;
      const delta = ((targetMod - prevMod) % 360 + 360) % 360;
      return prev + delta + extraSpins * 360;
    });
    setTimeout(() => { setSpinning(false); setWinner(matches[winIndex] || null); }, 4200);
  }, [spinToken, winnerId]);

  return (
    <div className="fixed inset-0 z-50 flex flex-col items-center justify-center px-8" style={{ background: 'rgba(43,36,29,0.92)' }}>
      <button className="absolute top-6 right-6 text-sm" style={{ color: '#FBF3E4', background: 'none', border: 'none' }} onClick={onClose}>Close</button>
      {matches.length === 0 ? (
        <p className="text-center" style={{ color: '#FBF3E4' }}>Get at least one order matched before spinning.</p>
      ) : (
        <>
          <p className="tft-display text-2xl font-semibold mb-8" style={{ color: '#FBF3E4' }}>Let the wheel decide</p>
          <div style={{ position: 'relative', width: size, height: size }}>
            <div style={{ position: 'absolute', top: -14, left: '50%', transform: 'translateX(-50%)', width: 0, height: 0, borderLeft: '12px solid transparent', borderRight: '12px solid transparent', borderTop: '20px solid #FBF3E4', zIndex: 2 }} />
            <div style={{ width: size, height: size, borderRadius: '50%', background: `conic-gradient(${gradientStops})`, transform: `rotate(${rotation}deg)`, transition: spinning ? 'transform 4.2s cubic-bezier(0.15,0.65,0.15,1)' : 'none', position: 'relative', border: '6px solid var(--card)' }}>
              {matches.map((meal, i) => {
                const center = i * segAngle + segAngle / 2;
                return (
                  <div key={meal.id} style={{ position: 'absolute', top: '50%', left: '50%', width: 0, height: 0, transform: `rotate(${center}deg) translate(0, -${size / 2 - 34}px)` }}>
                    <span style={{ display: 'inline-block', fontSize: '1.8rem', transform: 'translate(-50%, -50%)' }}>{meal.emoji}</span>
                  </div>
                );
              })}
            </div>
            <div style={{ position: 'absolute', top: '50%', left: '50%', width: 44, height: 44, marginLeft: -22, marginTop: -22, borderRadius: '50%', background: 'var(--ink)', border: '4px solid var(--card)' }} />
          </div>
          {!spinToken ? (
            <button className="tft-btn tft-btn-primary py-3.5 px-10 text-base mt-10" onClick={onRequestSpin}>Spin the Wheel</button>
          ) : spinning ? (
            <p className="text-sm mt-10" style={{ color: 'rgba(251,243,228,0.8)' }}>Spinning…</p>
          ) : null}
        </>
      )}
      {winner ? (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-8" style={{ background: 'rgba(43,36,29,0.9)' }}>
          <div className="tft-fade-in text-center">
            <p className="tft-display text-3xl font-semibold mb-6" style={{ color: '#FFFDF9' }}>Final Order!</p>
            <p style={{ fontSize: '4.5rem' }} className="mb-4">{winner.emoji}</p>
            <p className="tft-display text-2xl font-semibold mb-2" style={{ color: '#FFFDF9' }}>{winner.name}</p>
            <p className="text-sm mb-8" style={{ color: 'rgba(255,253,249,0.75)', maxWidth: '28ch' }}>{winner.description}</p>
            <div className="flex gap-3 justify-center">
              <button className="tft-btn tft-btn-outline py-3 px-6 text-base" style={{ borderColor: '#FBF3E4', color: '#FBF3E4' }} onClick={onRequestSpin}>Spin Again</button>
              <button className="tft-btn tft-btn-primary py-3 px-6 text-base" onClick={onClose}>Done</button>
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}

function SwipeScreen({ mode, category, deck, setDeck, ownSwipes, setOwnSwipes, onPersistSwipe, matches, onLeave, showWheel, wheelSpinToken, wheelWinnerId, onTriggerSpin, onCloseWheel }) {
  const [dragPos, setDragPos] = useState({ x: 0, y: 0 });
  const [showMatches, setShowMatches] = useState(false);
  const [celebration, setCelebration] = useState(null);
  const draggingRef = useRef(false);
  const startRef = useRef({ x: 0, y: 0 });
  const celebratedRef = useRef(new Set());

  useEffect(() => {
    if (mode !== 'multiplayer') return;
    const fresh = matches.find((m) => !celebratedRef.current.has(m.id));
    if (fresh) { celebratedRef.current.add(fresh.id); setCelebration(fresh); }
  }, [matches, mode]);

  const swipeCurrent = (liked) => {
    const meal = deck[0];
    if (!meal) return;
    const updated = { ...ownSwipes, [meal.id]: liked };
    setOwnSwipes(updated);
    onPersistSwipe(updated);
    draggingRef.current = false;
    setDragPos({ x: liked ? 650 : -650, y: 0 });
    setTimeout(() => { setDeck((d) => d.slice(1)); setDragPos({ x: 0, y: 0 }); }, 220);
  };

  const onPointerDown = (e) => { draggingRef.current = true; startRef.current = { x: e.clientX, y: e.clientY }; };
  const onPointerMove = (e) => { if (!draggingRef.current) return; setDragPos({ x: e.clientX - startRef.current.x, y: e.clientY - startRef.current.y }); };
  const onPointerUp = () => {
    if (!draggingRef.current) return;
    draggingRef.current = false;
    if (dragPos.x > 110) swipeCurrent(true);
    else if (dragPos.x < -110) swipeCurrent(false);
    else setDragPos({ x: 0, y: 0 });
  };

  return (
    <div className="flex flex-col flex-1">
      <div className="flex items-center justify-between px-5 py-4">
        <button className="text-sm" style={{ color: 'var(--ink-soft)', background: 'none', border: 'none' }} onClick={onLeave}>Leave</button>
        <CategoryChip category={category} />
        <button className="text-sm font-semibold px-3 py-1.5 rounded-full" style={{ background: 'var(--ink)', color: 'var(--paper)', border: 'none' }} onClick={() => setShowMatches(true)}>
          {mode === 'solo' ? 'Picks' : 'Orders'} {matches.length > 0 ? `· ${matches.length}` : ''}
        </button>
      </div>

      {deck.length === 0 ? (
        <div className="flex flex-col items-center justify-center flex-1 px-8 text-center">
          <p className="text-4xl mb-4">🎉</p>
          <p className="tft-display text-xl font-semibold mb-2">You've cleared the menu!</p>
          <p className="text-sm" style={{ color: 'var(--ink-soft)' }}>
            {mode === 'solo' ? 'Check your picks, or leave to start over.' : 'Check your orders, or leave to start a new ticket.'}
          </p>
        </div>
      ) : (
        <>
          <div className="relative flex-1 mx-5 mb-4" style={{ minHeight: 380 }}>
            {deck.slice(0, 3).map((meal, idx) => (
              <div
                key={meal.id}
                className={`absolute inset-0 tft-card-face ${idx === 0 ? '' : 'tft-fade-in'}`}
                style={{
                  zIndex: 10 - idx,
                  transform: `translate(${idx === 0 ? dragPos.x : 0}px, ${idx === 0 ? dragPos.y : idx * 8}px) rotate(${idx === 0 ? dragPos.x / 18 : 0}deg) scale(${1 - idx * 0.04})`,
                  transition: idx === 0 && draggingRef.current ? 'none' : 'transform 0.25s ease',
                  touchAction: 'none',
                  cursor: idx === 0 ? 'grab' : 'default',
                }}
                onPointerDown={idx === 0 ? onPointerDown : undefined}
                onPointerMove={idx === 0 ? onPointerMove : undefined}
                onPointerUp={idx === 0 ? onPointerUp : undefined}
                onPointerCancel={idx === 0 ? onPointerUp : undefined}
              >
                <MealCard meal={meal} />
              </div>
            ))}
          </div>
          <div className="flex items-center justify-center gap-10 pb-8">
            <button className="tft-round-btn" style={{ background: 'var(--ink)' }} onClick={() => swipeCurrent(false)} aria-label="Pass">
              <span style={{ color: '#FBF3E4', fontSize: 26, fontWeight: 700, lineHeight: 1 }}>✕</span>
            </button>
            <button className="tft-round-btn" style={{ background: 'var(--tomato)' }} onClick={() => swipeCurrent(true)} aria-label="Order it">
              <span style={{ fontSize: 26, lineHeight: 1 }}>❤️</span>
            </button>
          </div>
        </>
      )}

      {showMatches ? (
        <MatchesSheet matches={matches} mode={mode} onClose={() => setShowMatches(false)} onSpin={() => { setShowMatches(false); onTriggerSpin(); }} />
      ) : null}
      {celebration ? (
        <CelebrationOverlay meal={celebration} onDismiss={() => setCelebration(null)} onSpin={() => { setCelebration(null); onTriggerSpin(); }} />
      ) : null}
      {showWheel ? (
        <WheelScreen matches={matches} onClose={onCloseWheel} spinToken={wheelSpinToken} winnerId={wheelWinnerId} onRequestSpin={onTriggerSpin} />
      ) : null}
    </div>
  );
}

// ==================== TOP LEVEL ====================
function TableForTwo() {
  const [screen, setScreen] = useState('welcome');
  const [mode, setMode] = useState('multiplayer');
  const [role, setRole] = useState(null);
  const [code, setCode] = useState(null);
  const [category, setCategory] = useState('Dinner');
  const [hasGuest, setHasGuest] = useState(false);
  const [deck, setDeck] = useState([]);
  const [ownSwipes, setOwnSwipes] = useState({});
  const [partnerSwipes, setPartnerSwipes] = useState({});
  const [joinError, setJoinError] = useState('');
  const [createError, setCreateError] = useState('');
  const [connecting, setConnecting] = useState(false);
  const [showWheel, setShowWheel] = useState(false);
  const [wheelSpinToken, setWheelSpinToken] = useState(null);
  const [wheelWinnerId, setWheelWinnerId] = useState(null);
  const lastSeenSpinToken = useRef(null);

  const matches = mode === 'solo'
    ? allMeals().filter((m) => ownSwipes[m.id] === true)
    : allMeals().filter((m) => ownSwipes[m.id] === true && partnerSwipes[m.id] === true);

  // Real-time listeners via Firestore (replaces the old polling approach).
  useEffect(() => {
    if (!code || !role || !window.fbDb) return;
    const metaUnsub = window.fbDb.collection('sessions').doc(code).onSnapshot(
      (snap) => {
        if (!snap.exists) return;
        const data = snap.data();
        setHasGuest(!!data.hasGuest);
        // A partner's wheel spin arrives here too — same spinToken drives
        // the animation on both screens, whoever started it.
        if (data.wheel && data.wheel.spinToken && data.wheel.spinToken !== lastSeenSpinToken.current) {
          lastSeenSpinToken.current = data.wheel.spinToken;
          setWheelWinnerId(data.wheel.winnerId);
          setWheelSpinToken(data.wheel.spinToken);
          setShowWheel(true);
        }
      },
      (err) => console.error('meta listener error', err)
    );
    const otherRole = role === 'host' ? 'guest' : 'host';
    const swipesUnsub = window.fbDb.collection('sessions').doc(code).collection('swipes').doc(otherRole).onSnapshot(
      (snap) => { if (snap.exists) setPartnerSwipes(snap.data().items || {}); },
      (err) => console.error('swipes listener error', err)
    );
    return () => { metaUnsub(); swipesUnsub(); };
  }, [code, role]);

  useEffect(() => {
    if (role === 'host' && hasGuest && screen === 'waiting') setScreen('swipe');
  }, [hasGuest, role, screen]);

  const persistOwnSwipe = async (updated) => {
    if (!code || !role || !window.fbDb) return;
    try {
      await window.fbDb.collection('sessions').doc(code).collection('swipes').doc(role).set({ items: updated });
    } catch (e) { console.error('persistOwnSwipe failed', e); }
  };

  // Picks a winner and, in multiplayer, syncs it to Firestore so the
  // partner's screen animates to the exact same result at (almost) the
  // same moment. Works with zero backend in solo mode.
  const handleTriggerSpin = () => {
    if (matches.length === 0) return;
    const idx = Math.floor(Math.random() * matches.length);
    const winnerId = matches[idx].id;
    const token = Date.now();
    lastSeenSpinToken.current = token;
    setWheelWinnerId(winnerId);
    setWheelSpinToken(token);
    setShowWheel(true);
    if (mode === 'multiplayer' && code && window.fbDb) {
      window.fbDb.collection('sessions').doc(code).set({ wheel: { winnerId, spinToken: token } }, { merge: true })
        .catch((e) => console.error('wheel sync failed', e));
    }
  };

  const handleCreate = async (selectedCategory) => {
    setConnecting(true);
    setCreateError('');
    if (!window.fbDb) {
      setCreateError('Multiplayer needs Firebase configured in index.html first. Try Solo mode for now.');
      setConnecting(false);
      return;
    }
    const newCode = generateCode();
    try {
      const stableDeck = getStableShuffledDeck(selectedCategory);
      await window.fbDb.collection('sessions').doc(newCode).set({
        category: selectedCategory, hasGuest: false, deck: stableDeck, createdAt: Date.now(),
      });
      setMode('multiplayer');
      setCode(newCode);
      setRole('host');
      setCategory(selectedCategory);
      setDeck(stableDeck.map((m) => ({ ...m, category: selectedCategory })));
      setOwnSwipes({});
      setPartnerSwipes({});
      setScreen('waiting');
    } catch (e) {
      setCreateError("Couldn't open a ticket — check your Firebase setup and connection.");
    } finally {
      setConnecting(false);
    }
  };

  const handleJoin = async (rawCode) => {
    const upper = rawCode.trim().toUpperCase();
    if (!upper) return;
    setConnecting(true);
    setJoinError('');
    if (!window.fbDb) {
      setJoinError('Multiplayer needs Firebase configured in index.html first.');
      setConnecting(false);
      return;
    }
    try {
      const ref = window.fbDb.collection('sessions').doc(upper);
      const snap = await ref.get();
      if (!snap.exists) {
        setJoinError("We couldn't find that ticket. Double check the code.");
        setConnecting(false);
        return;
      }
      const meta = snap.data();
      const sharedDeck = meta.deck || getStableShuffledDeck(meta.category);
      await ref.set({ ...meta, hasGuest: true, deck: sharedDeck });
      setMode('multiplayer');
      setCode(upper);
      setRole('guest');
      setCategory(meta.category);
      setDeck(sharedDeck.map((m) => ({ ...m, category: meta.category })));
      setOwnSwipes({});
      setPartnerSwipes({});
      setScreen('swipe');
    } catch (e) {
      setJoinError("We couldn't find that ticket. Double check the code.");
    } finally {
      setConnecting(false);
    }
  };

  const handleStartSolo = (selectedCategory) => {
    setMode('solo');
    setRole(null);
    setCode(null);
    setCategory(selectedCategory);
    const stableDeck = getStableShuffledDeck(selectedCategory);
    setDeck(stableDeck.map((m) => ({ ...m, category: selectedCategory })));
    setOwnSwipes({});
    setPartnerSwipes({});
    setScreen('swipe');
  };

  const handleLeave = () => {
    setScreen('welcome');
    setMode('multiplayer');
    setRole(null);
    setCode(null);
    setDeck([]);
    setOwnSwipes({});
    setPartnerSwipes({});
    setHasGuest(false);
    setJoinError('');
    setCreateError('');
    setShowWheel(false);
    setWheelSpinToken(null);
    setWheelWinnerId(null);
    lastSeenSpinToken.current = null;
  };

  return (
    <div className="tft-root">
      <GlobalStyles />
      <div className="w-full max-w-md mx-auto flex flex-col flex-1">
        {screen === 'welcome' && (
          <WelcomeScreen
            onStart={() => { setMode('multiplayer'); setScreen('create'); }}
            onJoin={() => setScreen('join')}
            onSolo={() => { setMode('solo'); setScreen('create'); }}
          />
        )}
        {screen === 'create' && (
          <CreateScreen
            onBack={() => setScreen('welcome')}
            onConfirm={mode === 'solo' ? handleStartSolo : handleCreate}
            confirmLabel={mode === 'solo' ? 'Start Swiping' : 'Create Ticket'}
            connecting={mode === 'solo' ? false : connecting}
            error={mode === 'solo' ? '' : createError}
          />
        )}
        {screen === 'join' && (
          <JoinScreen onBack={() => setScreen('welcome')} onJoin={handleJoin} error={joinError} connecting={connecting} />
        )}
        {screen === 'waiting' && <WaitingScreen code={code} onLeave={handleLeave} />}
        {screen === 'swipe' && (
          <SwipeScreen
            mode={mode}
            category={category}
            deck={deck}
            setDeck={setDeck}
            ownSwipes={ownSwipes}
            setOwnSwipes={setOwnSwipes}
            onPersistSwipe={persistOwnSwipe}
            matches={matches}
            onLeave={handleLeave}
            showWheel={showWheel}
            wheelSpinToken={wheelSpinToken}
            wheelWinnerId={wheelWinnerId}
            onTriggerSpin={handleTriggerSpin}
            onCloseWheel={() => setShowWheel(false)}
          />
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <ErrorBoundary>
    <TableForTwo />
  </ErrorBoundary>
);
</script>
</body>
